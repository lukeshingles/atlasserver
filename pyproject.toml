[build-system]
requires = [
    "setuptools>=82.0.1",
    "setuptools_scm>=10.0.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "atlasserver"
authors = [{ name = "Luke Shingles", email = "luke.shingles@gmail.com" }]
description = "ATLAS Forced Photometry server"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]
requires-python = ">=3.13"
readme = { file = "README.md", content-type = 'text/markdown' }
dependencies = [
    "astrocalc>=0.4.2",
    "astropy>=6.1.0",
    "django>=6.1",
    "bokeh>=3.9.2",
    "django-filter>=25.2",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.28.0",
    "fundamentals>=2.6.4",
    "geoip2>=5.2.0",
    "julian>=0.14",
    "markdown>=3.6",
    "matplotlib>=3.11.0",
    "mod-wsgi-standalone>=6.0.4",
    "mysqlclient>=2.2.4",
    "pandas>=3.0.3",
    "psutil>=5.9.0",
    "pycountry>=23.12.11",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "djangorestframework-stubs>=3.17.1",
    "django-stubs[compatible-mypy]>=6.0.7",
    "mypy>=2.0",
    "pip>=26.1.2",
    "prek>=0.4.12",
    "pylint>=4.0.6",
    "pylint-django>=2.5.5",
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "types-pyyaml>=6.0.12.20240311",
    "types-requests>=2.31.0.20240406",
    "types-Markdown",
    "types-pycurl",
    "types-python-dateutil",
]

[project.urls]
Repository = "https://github.com/lukeshingles/atlasserver"

[project.scripts]
atlaswebserver = 'atlasserver.atlaswebserver:main'
atlastaskrunner = 'atlasserver.atlastaskrunner:main'

[tool.coverage.run]
source = ["atlasserver"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests.py",
    "atlasserver/plot_atlas_fp.py", # vendored third-party code
    "atlasserver/settings*.py",
    "atlasserver/wsgi.py",
    "atlasserver/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if t.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.13"
exclude = "(build)|(tests)|(migrations)|(static)|plot_atlas_fp.py"
ignore_missing_imports = true
plugins = "mypy_django_plugin.main"
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
extra_checks = true
files = "**/*.py"
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
disallow_any_generics = false
disallow_subclassing_any = false

# A ratchet, not a global switch. The codebase is largely annotated already, so the modules that
# are fully annotated turn the strict flags on here to keep them that way; the rest are listed in
# the TODO below and get converted one at a time. Flipping disallow_untyped_defs on globally would
# mean annotating views.py and serializers.py in one go, and their DRF hook methods (request, obj,
# attrs, serializer) are exactly where a guessed annotation is worse than none.
[[tool.mypy.overrides]]
module = [
    "atlasserver.forcephot.admin",
    "atlasserver.forcephot.exception",
    "atlasserver.forcephot.models",
    "atlasserver.forcephot.netaddr",
    "atlasserver.forcephot.pagination",
    "atlasserver.forcephot.queue",
    "atlasserver.forcephot.throttles",
    "atlasserver.forcephot.verification",
    "atlasserver.forcephot.webhooks",
    "atlasserver.taskrunner.status",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# TODO: the modules still to convert are the ones carrying an "ANN" per-file-ignore under
# [tool.ruff.lint.per-file-ignores] below -- that list rather than a third copy here, which would
# be the one that goes stale. Converting one means adding it to the list above and deleting its
# ignore line, so the ratchet only ever tightens.

[tool.django-stubs]
# settings_test star-imports the production settings after presetting the env vars needed to
# import them, so type checking works on machines with no .env or secrets (e.g. the CI lint job)
django_settings_module = "atlasserver.settings_test"
ignore_missing_model_attributes = true

[tool.pylint]
max-line-length = 120
errors-only = true
load-plugins = "pylint_django"
# settings_test, for the same reason as tool.django-stubs below: it presets the env vars that
# settings.py refuses to import without, so pylint works on machines with no .env or secrets
django-settings-module = "atlasserver.settings_test"

[tool.pylint.typecheck]
ignored-modules = ["astropy", "extinction"]

[tool.pylint.MASTER]
ignore-paths = "atlasserver/plot_atlas_fp.py"

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [
    "**/build*",
    "**/tests*",
    "**/migrations*",
    "**/static*",
    "**/.*",
    "**/.venv*",
    "**/plot_atlas_fp.py",
]
python-version = "3.13"
preset = "legacy"
ignore-missing-imports = ["*"]

[tool.pyrefly.errors]
redundant-cast = "warn"

[tool.pyright]
typeCheckingMode = "off"
exclude = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    'build',
    'dist',
    'target',
    '**/plot_atlas_fp.py',
    '**/.venv',
]

[tool.typos]
files.extend-exclude = ["**/plot_atlas_fp.py"]

[tool.ruff]
extend-exclude = ["plot_atlas_fp.py"]
line-length = 120
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A001",
    "A002",
    "A003",
    # the rest of ANN is on; Any is genuinely the right annotation at the DRF and Django hook
    # boundaries (a paginator's `view`, a serialized response body), where the framework passes
    # whatever the caller had
    "ANN401",
    "ARG001",  # ignored because variables in df.eval() are not detected
    "ARG002",
    "BLE001",
    "C901",    # complex-structure
    "CPY001",
    "COM812",  # missing-trailing-comma
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
    "D106",
    "D107",    # undocumented-public-init
    "D203",    # one-blank-line-before-class
    "D204",
    "D213",    # multi-line-summary-second-line
    "D417",    # undocumented-param
    "DJ001",
    "E402",
    "E501",    # Line too long
    "ERA001",  # commented-out-code
    "FBT",
    "FIX002",  # line contains TODO
    "INP001",
    "ISC001",
    "PGH003",
    "PLC0415", # import-outside-toplevel
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917",
    "PLR2004", # magic-value-comparison
    "RUF012",
    "S101",    # Use of assert detected
    "S108",    # hardcoded-temp-file
    "S113",
    "S603",    # subprocess-without-shell-equals-true
    "S605",    # start-process-with-a-shell
    "S607",    # start-process-with-partial-path
    "SIM115",  # use context handler for opening files
    "T201",    # print found
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
]
fixable = ["ALL"]
unfixable = [
    "COM812", # missing-trailing-comma
    "ERA001", # commented-out-code (will just delete it!)
    "F401",   # unused-import (can be annoying to have import disappear while editing)
    "F841",   # unused-variable
    "SIM222", # expr-or-true
    "SIM223", # expr-and-false
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.lint.per-file-ignores]
"plot_atlas_fp.py" = ["ALL"]
"**/tests.py" = ["S106"]

# The ANN rules are on globally (they were in the blanket ignore list, so nothing stopped new code
# from being unannotated). These are the modules not yet converted; the same list as the mypy
# ratchet TODO, and it should only ever get shorter. ANN401 is ignored where it is: DRF hook
# methods legitimately take Any.
"**/migrations/*.py" = ["ANN"]
"atlasserver/forcephot/forms.py" = ["ANN"]
"atlasserver/forcephot/misc.py" = ["ANN"]
"atlasserver/forcephot/serializers.py" = ["ANN"]
"atlasserver/forcephot/views.py" = ["ANN"]
"atlasserver/taskrunner/main.py" = ["ANN"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["atlasserver*"]

[tool.setuptools.package-data]
"atlasserver.forcephot" = ["templates/**/*"]

# forcephot/static is a symlink into the repo's top-level static/ directory;
# static assets are a deployment concern (collectstatic from a checkout), not package data
[tool.setuptools.exclude-package-data]
"atlasserver.forcephot" = ["static"]

[tool.setuptools_scm]
write_to = "_version.py"
local_scheme = "no-local-version"

[tool.ty.src]
exclude = ["**/build/", "atlasserver/plot_atlas_fp.py"]
