---
name: Test and lint

on:
    merge_group:
    push:
    repository_dispatch:
        types: [trigger_checks]

jobs:
    lint:
        name: Lint and type check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Python and uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true

            - name: Install atlasserver
              run: uv pip install -e .

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run mypy
              run: uv run -- mypy --install-types --non-interactive

            - name: Run pylint
              run: uv run -- pylint atlasserver

            - name: Run ty
              # skipped on pre-commit.ci (see .pre-commit-config.yaml), which has no network access
              # to resolve the dependencies ty type checks against, so it runs here instead
              if: always()
              run: uvx ty check

            - name: Run prek pre-commit checks
              uses: j178/prek-action@v2

    frontend:
        name: Frontend tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: static/js/queuepage
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run frontend tests
              run: npm test

            - name: Check the committed bundles are up to date
              # the built .min.js files are committed and served directly, so a source change that
              # was never rebuilt would ship stale JavaScript
              run: |
                  ./build.sh
                  git diff --exit-code -- ../*.min.js

    test:
        name: Run tests
        environment: test
        runs-on: ubuntu-latest
        env:
            ATLASSERVER_DJANGO_MYSQL_DBNAME: atlasserver
            ATLASSERVER_DJANGO_MYSQL_USER: root
            ATLASSERVER_DJANGO_MYSQL_PASSWORD: root
            ATLASSERVER_EMAIL_HOST_USER: atlasforced@gmail.com
            ATLASSERVER_DJANGO_SECRET_KEY: ${{secrets.ATLASSERVER_DJANGO_SECRET_KEY}}
            # settings_test defaults to SQLite so that the suite runs on a developer machine with
            # no MySQL server; CI opts back in to the engine used in production
            ATLASSERVER_TEST_DB: mysql
            DJANGO_SETTINGS_MODULE: atlasserver.settings_test

        # services:
        #     mysql:
        #         image: mysql:5.7
        #         env:
        #             MYSQL_ALLOW_EMPTY_PASSWORD: yes
        #             MYSQL_DATABASE: atlasserver
        #             MYSQL_USER: root
        #             MYSQL_PASSWORD: password
        #             MYSQL_ROOT_PASSWORD: password
        #         ports:
        #             - 3306
        #         options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Python and uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true

            - name: Install atlasserver
              run: uv pip install -e .

            - name: Install geoip databases
              # the script now exits non-zero when a download fails (so cron notices a stale
              # database), but CI may have no MaxMind key and the Django tests don't need the
              # databases (test requests come from 127.0.0.1, which skips the GeoIP lookup)
              continue-on-error: true
              env:
                  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
              run: ./update_geoipdatabase.sh

            - name: Set up MySQL
              run: |
                  sudo /etc/init.d/mysql start
                  echo "mysql started"
                  mysql -e "CREATE DATABASE ${{env.ATLASSERVER_DJANGO_MYSQL_DBNAME}};" -u${{env.ATLASSERVER_DJANGO_MYSQL_USER}} -p${{env.ATLASSERVER_DJANGO_MYSQL_PASSWORD}}
                  # migrations are not tracked in this repository (see migrations/.gitignore), so
                  # they are generated from the models here and on deployment
                  ./manage.py makemigrations
                  ./manage.py migrate

            - name: Run Django Tests
              run: |
                  uv run -- coverage run ./manage.py test

            - name: Coverage report
              if: always()
              run: |
                  uv run -- coverage report
                  uv run -- coverage xml

            - name: Start and stop server
              run: |
                  atlaswebserver start
                  atlastaskrunner start
                  atlastaskrunner stop
                  atlaswebserver stop
