---
name: Test and lint

on:
    merge_group:
    push:
    repository_dispatch:
        types: [trigger_checks]

jobs:
    lint:
        name: Lint and type check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Python and uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true

            - name: Install atlasserver
              run: uv pip install -e .

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run mypy
              if: always()
              run: uv run -- mypy --install-types --non-interactive

            - name: Run pyrefly
              if: always()
              run: uv run -- pyrefly check

            - name: Run ty
              # skipped on pre-commit.ci (see .pre-commit-config.yaml), which has no network access
              # to resolve the dependencies ty type checks against, so it runs here instead
              if: always()
              run: uv run -- ty check

            - name: Run prek pre-commit checks
              uses: j178/prek-action@v2

    frontend:
        name: Frontend tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: static/js/queuepage
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run frontend tests
              run: npm test

            - name: Check the committed bundles are up to date
              # the built .min.js files are committed and served directly, so a source change that
              # was never rebuilt would ship stale JavaScript. ../vendor is covered too: it holds
              # the self-hosted react that the queue page's import map points at, so a react bump
              # in package.json that was never rebuilt would leave the page on the old copy.
              run: |
                  ./build.sh
                  git diff --exit-code -- ../*.min.js ../vendor

    test:
        name: Run tests
        environment: test
        runs-on: ubuntu-latest
        env:
            ATLASSERVER_DJANGO_MYSQL_DBNAME: atlasserver
            ATLASSERVER_DJANGO_MYSQL_USER: root
            ATLASSERVER_DJANGO_MYSQL_PASSWORD: root
            ATLASSERVER_EMAIL_HOST_USER: atlasforced@gmail.com
            ATLASSERVER_DJANGO_SECRET_KEY: ${{secrets.ATLASSERVER_DJANGO_SECRET_KEY}}
            # settings_test defaults to SQLite so that the suite runs on a developer machine with
            # no MySQL server; CI opts back in to the engine used in production
            ATLASSERVER_TEST_DB: mysql
            # "localhost" would make libmysqlclient look for a unix socket, but the MySQL service
            # below is only reachable over TCP on the mapped port
            ATLASSERVER_DJANGO_MYSQL_HOST: 127.0.0.1
            DJANGO_SETTINGS_MODULE: atlasserver.settings_test
            # required whenever DEBUG is off, which the "Start and stop server" step below is: it
            # runs the real production settings, so it has to supply the real production
            # configuration. The suite itself never sees this -- settings_test forces DEBUG on.
            ATLASSERVER_SITE_ORIGIN: https://fallingstar-data.com

        services:
            mysql:
                # Django 6.1 dropped support for MySQL < 8.4, which rules out the MySQL bundled
                # with the runner image
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: atlasserver
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Python and uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true

            - name: Install atlasserver
              run: uv pip install -e .

            - name: Install geoip databases
              # the script now exits non-zero when a download fails (so cron notices a stale
              # database), but CI may have no MaxMind key and the Django tests don't need the
              # databases (test requests come from 127.0.0.1, which skips the GeoIP lookup)
              continue-on-error: true
              env:
                  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
              run: ./update_geoipdatabase.sh

            - name: Set up database
              # the mysql service container has already created the database and passed its
              # health check by the time steps run
              run: |
                  # fail if a model change was committed without its migration, rather than
                  # generating one here that would never reach the repository
                  ./manage.py makemigrations --check --dry-run
                  # apply the committed migrations, which is the same path a deployment takes
                  ./manage.py migrate

            - name: Run Django Tests
              run: |
                  uv run -- coverage run ./manage.py test

            - name: Coverage report
              if: always()
              run: |
                  uv run -- coverage report
                  uv run -- coverage xml

            - name: Start and stop server
              run: |
                  atlaswebserver start
                  atlastaskrunner start
                  atlastaskrunner stop
                  atlaswebserver stop
