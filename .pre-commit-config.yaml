---
ci:
    # ty resolves and downloads the project's dependencies in order to type check against them,
    # and pre-commit.ci runs hooks without network access, so it fails there with a DNS error
    # rather than a type error. It runs locally and in the "Lint and type check" GitHub Actions
    # job, where the environment is already installed.
    skip: [ty]

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: [--maxkb=500]
          - id: check-ast
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: check-merge-conflict
          - id: check-toml
          #- id: check-yaml
          - id: detect-private-key
          - id: destroyed-symlinks
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: name-tests-test
          - id: requirements-txt-fixer
          - id: trailing-whitespace
            exclude_types: [svg]

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.1
      hooks:
          - id: uv-lock

    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.65
      hooks:
          - id: ty
            name: ty
            args: [--all-extras]
