{% load static %}
{% load i18n %}

{# Included by both base.html and rest_framework/api.html. It lived in base.html until the browsable #}
{# API moved to Bootstrap 5 as well; before that the API page could not use this markup and carried #}
{# a hand-measured imitation of it in a <style> block, which had to be re-measured whenever the #}
{# navbar changed. Both pages now load the same stylesheet, so one copy of the markup serves both. #}

<nav class="navbar navbar-expand-lg" aria-label="{% translate "navbar" %}">
  <div class="container">
    <a class="navbar-brand" rel="nofollow" href="{% url 'index' %}"><img src="{% static "images/logos/atlas_logo.svg" %}" alt="ATLAS Forced Photometry home" /></a>

    {# Bootstrap 5's collapse toggle. data-bs-* rather than Bootstrap 3's data-*, and it #}
    {# needs no jQuery -- the bundle at the end of the page is self-contained. #}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarmain" aria-controls="navbarmain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarmain">
      {# the current page is marked here rather than in main.css, which is served as a #}
      {# static file and so is never rendered by the template engine #}
      {% url 'index' as index_url %}
      {% url 'resultdesc' as resultdesc_url %}
      {% url 'task-list' as tasklist_url %}
      {% url 'apiguide' as apiguide_url %}
      {% url 'faq' as faq_url %}
      {% url 'stats' as stats_url %}
      <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link{% if request.path == index_url %} active{% endif %}" href="{{ index_url }}">Home</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == resultdesc_url %} active{% endif %}" href="{{ resultdesc_url }}">Output</a></li>
          {# Queue and API share a path and differ only by the format parameter #}
          <li class="nav-item"><a class="nav-link{% if not user.is_authenticated %} loginrequired{% endif %}{% if request.path == tasklist_url and request.GET.format != 'api' %} active{% endif %}" href="{{ tasklist_url }}" rel="nofollow">Queue</a></li>
          <li class="nav-item"><a class="nav-link{% if not user.is_authenticated %} loginrequired{% endif %}{% if request.path == tasklist_url and request.GET.format == 'api' %} active{% endif %}" href="{{ tasklist_url }}?format=api" rel="nofollow">API</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == apiguide_url %} active{% endif %}" href="{{ apiguide_url }}">API Guide</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == faq_url %} active{% endif %}" href="{{ faq_url }}">FAQ</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == stats_url %} active{% endif %}" href="{{ stats_url }}">Stats &amp; Issues</a></li>
      </ul>

      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          {% if user.is_staff %}
            <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}" rel="nofollow">Admin</a></li>
          {% endif %}
          <li class="nav-item dropdown">
            <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" role="button" aria-expanded="false">
              {{ request.user.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><span class="dropdown-item-text">{{ request.user.email }}</span></li>
              <li><a class="dropdown-item" href="{% url 'email_change' %}">Change email</a></li>
              <li><a class="dropdown-item" href="{% url 'password_change' %}">Change password</a></li>
              <li><a class="dropdown-item" href="{% url 'apitoken' %}">API token</a></li>
              <li>
                {# Django's LogoutView only accepts POST, so a plain link would return HTTP 405. #}
                {# No "next" field: LogoutView prefers it over LOGOUT_REDIRECT_URL, which would #}
                {# send the now-anonymous user back to a login-protected page. #}
                <form action="{% url 'logout' %}" method="post" class="logoutform">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">Log out</button>
                </form>
              </li>
            </ul>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
          {# was DRF's {% optional_login %} tag, which is one of the things that tied this #}
          {# layout to the browsable API #}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Log in</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
