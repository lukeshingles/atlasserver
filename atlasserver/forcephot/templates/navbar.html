{% load static %}
{% load i18n %}

{# Included by both base.html and rest_framework/api.html. It lived in base.html until the browsable #}
{# API moved to Bootstrap 5 as well; before that the API page could not use this markup and carried #}
{# a hand-measured imitation of it in a <style> block, which had to be re-measured whenever the #}
{# navbar changed. Both pages now load the same stylesheet, so one copy of the markup serves both. #}

<nav class="navbar navbar-expand-lg" aria-label="{% translate "navbar" %}">
  <div class="container">
    {# the mark is aria-hidden and the link is named by the text beside it, which is what the img #}
    {# alt used to do: an inline <svg> has no alt attribute, and a <title> inside it is announced #}
    {# less consistently than a plain visually-hidden string #}
    <a class="navbar-brand" rel="nofollow" href="{% url 'index' %}">
      {% include "atlaslogo.html" %}
      <span class="visually-hidden">ATLAS Forced Photometry home</span>
    </a>

    {# Bootstrap 5's collapse toggle. data-bs-* rather than Bootstrap 3's data-*, and it #}
    {# needs no jQuery -- the bundle at the end of the page is self-contained. #}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarmain" aria-controls="navbarmain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarmain">
      {# the current page is marked here rather than in main.css, which is served as a #}
      {# static file and so is never rendered by the template engine #}
      {% url 'index' as index_url %}
      {% url 'resultdesc' as resultdesc_url %}
      {% url 'task-list' as tasklist_url %}
      {% url 'apiguide' as apiguide_url %}
      {% url 'faq' as faq_url %}
      {% url 'stats' as stats_url %}
      <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link{% if request.path == index_url %} active{% endif %}" href="{{ index_url }}">Home</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == resultdesc_url %} active{% endif %}" href="{{ resultdesc_url }}">Output</a></li>
          {# Queue and API share a path and differ only by the format parameter. Both need an #}
          {# account, so while nobody is signed in they are greyed (see .loginrequired in main.css) #}
          {# and carry a padlock saying why -- greying alone reads as "broken" as readily as it #}
          {# reads as "not yet". The title is on the <a> because a title on the <svg> inside it is #}
          {# not surfaced consistently. #}
          <li class="nav-item"><a class="nav-link{% if not user.is_authenticated %} loginrequired{% endif %}{% if request.path == tasklist_url and request.GET.format != 'api' %} active{% endif %}" href="{{ tasklist_url }}" rel="nofollow"{% if not user.is_authenticated %} title="Sign in to use the task queue"{% endif %}>Queue{% if not user.is_authenticated %}{% include "navlock.html" %}{% endif %}
            {# The user's own waiting and running tasks, so "is anything still going?" can be answered #}
            {# from any page. Hidden rather than absent at zero -- it is still not shown, but the #}
            {# element is there for tasklist.jsx to put a number back into: the queue page never #}
            {# navigates, so the count this was rendered with is the last one the server ever sends, #}
            {# and submitting or finishing a task there would otherwise leave it stale until a reload. #}
            {% if user.is_authenticated %}<span class="badge rounded-pill queuecount"{% if not queued_task_count %} hidden{% endif %}><span class="queuecount-number">{{ queued_task_count }}</span><span class="visually-hidden"> tasks waiting or running</span></span>{% endif %}</a></li>
          <li class="nav-item"><a class="nav-link{% if not user.is_authenticated %} loginrequired{% endif %}{% if request.path == tasklist_url and request.GET.format == 'api' %} active{% endif %}" href="{{ tasklist_url }}?format=api" rel="nofollow"{% if not user.is_authenticated %} title="Sign in to use the browsable API"{% endif %}>API{% if not user.is_authenticated %}{% include "navlock.html" %}{% endif %}</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == apiguide_url %} active{% endif %}" href="{{ apiguide_url }}">API Guide</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == faq_url %} active{% endif %}" href="{{ faq_url }}">FAQ</a></li>
          <li class="nav-item"><a class="nav-link{% if request.path == stats_url %} active{% endif %}" href="{{ stats_url }}">Stats &amp; Issues</a></li>
      </ul>

      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          {% if user.is_staff %}
            <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}" rel="nofollow">Admin</a></li>
          {% endif %}
          <li class="nav-item dropdown">
            <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" role="button" aria-expanded="false">
              {{ request.user.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><span class="dropdown-item-text">{{ request.user.email }}</span></li>
              <li><a class="dropdown-item" href="{% url 'email_change' %}">Change email</a></li>
              <li><a class="dropdown-item" href="{% url 'password_change' %}">Change password</a></li>
              <li><a class="dropdown-item" href="{% url 'apitoken' %}">API token</a></li>
              <li>
                {# Django's LogoutView only accepts POST, so a plain link would return HTTP 405. #}
                {# No "next" field: LogoutView prefers it over LOGOUT_REDIRECT_URL, which would #}
                {# send the now-anonymous user back to a login-protected page. #}
                <form action="{% url 'logout' %}" method="post" class="logoutform">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">Log out</button>
                </form>
              </li>
            </ul>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
          {# was DRF's {% optional_login %} tag, which is one of the things that tied this #}
          {# layout to the browsable API #}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Log in</a></li>
        {% endif %}

        {# Light/dark mode. Hidden until theme.js removes the d-none, so a visitor without #}
        {# JavaScript is not offered a control that cannot do anything -- the same reason #}
        {# copycode.js adds its button rather than the template carrying one. Which icon shows and #}
        {# which entry is marked is also theme.js's, since only it knows the stored preference. #}
        <li class="nav-item dropdown themeswitch d-none">
          <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Colour theme">
            {# The three are stacked one over another so the change between them can be a rotation and #}
            {# a fade rather than one icon vanishing and another appearing: display cannot transition, #}
            {# and opacity can only cross-fade two things that occupy the same place. All three start #}
            {# transparent, so nothing shows until theme.js marks the one that is in force -- which is #}
            {# what the d-none on each of them used to do. #}
            <span class="themeicon-stack">
              <svg class="themeicon themeicon-light" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <circle cx="8" cy="8" r="3.4"/>
                <path d="M8 0v2.1M8 13.9V16M0 8h2.1M13.9 8H16M2.34 2.34l1.5 1.5M12.16 12.16l1.5 1.5M13.66 2.34l-1.5 1.5M3.84 12.16l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <svg class="themeicon themeicon-dark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 1A7 7 0 1 0 8 15A9 9 0 0 1 8 1Z" transform="rotate(-25 8 8)"/>
              </svg>
              <svg class="themeicon themeicon-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M8 1.6A6.4 6.4 0 0 0 8 14.4Z"/>
              </svg>
            </span>
            {# a word below the navbar's collapse breakpoint, where this sits in a stacked menu of #}
            {# words; beside the other links on a wide screen the icon carries it and main.css #}
            {# hides the text from sight but not from assistive technology #}
            <span class="themeswitch-label">Colour theme</span>
          </button>

          {# menuitemradio, because the three are one choice and exactly one of them holds: a #}
          {# screen reader then reads the stored mode as the checked option rather than reading #}
          {# three unrelated commands. #}
          <ul class="dropdown-menu dropdown-menu-end" role="menu" aria-label="Colour theme">
            <li><button type="button" class="dropdown-item" data-theme-value="light" role="menuitemradio" aria-checked="false">Light</button></li>
            <li><button type="button" class="dropdown-item" data-theme-value="dark" role="menuitemradio" aria-checked="false">Dark</button></li>
            <li><button type="button" class="dropdown-item" data-theme-value="auto" role="menuitemradio" aria-checked="false">Auto</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
